<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>C&C LAB25Q Universal World Viewer</title><style>:root{--gold:#e4b83f;--ink:#071421;--panel:#0b2031;--control:#0a100d}*{box-sizing:border-box}html,body{margin:0;background:#080b0e;color:#e9edf0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.qa{max-width:1180px;margin:auto;padding:12px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bar select,.bar button{background:#132230;color:#fff;border:1px solid #52606d;border-radius:6px;padding:8px 10px}.note{font:12px system-ui;color:#aeb9c2;margin-left:auto}.game{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border:2px solid #24313a;image-rendering:pixelated}.world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.hud{position:absolute;z-index:5;left:25%;top:0;width:50%;height:62px;background:linear-gradient(#0b263b,#071a2a);border:2px solid var(--gold);border-top:0;border-radius:0 0 8px 8px;box-shadow:0 2px 0 #07101a;display:grid;grid-template-columns:120px 1fr;pointer-events:none}.health{border-right:2px solid #9d7b2a;padding:5px 16px}.label{text-align:center;color:#f7d75f;font:bold 10px monospace;letter-spacing:2px;border-bottom:1px solid #8d7331;padding-bottom:3px}.hearts{display:flex;gap:10px;margin-top:10px}.hearts img{width:18px;height:18px;object-fit:contain;image-rendering:pixelated}.progress{padding:4px 20px}.stageTitle{text-align:center;font:bold 10px monospace;letter-spacing:1.5px;margin-bottom:5px}.track{position:relative;height:27px;border-top:1px solid #9d7b2a;padding-top:7px}.track img.path{position:absolute;left:4.8%;top:8px;width:86.95%;height:12px;object-fit:fill;image-rendering:pixelated}.marker{position:absolute;top:2px;left:48.275%;width:24px;height:24px;overflow:hidden;transform:translateX(-50%)}.marker img{height:100%;width:200%;max-width:none;image-rendering:pixelated}.finish{position:absolute;right:3%;top:-1px;font-size:18px}.player{position:absolute;z-index:4;left:21%;bottom:calc(14.45% + 40px);width:54px;height:66px;object-fit:contain;object-position:left bottom;image-rendering:pixelated;pointer-events:none}.controls{position:absolute;z-index:7;left:0;right:0;bottom:0;height:40px;background:rgba(8,14,10,.97);border-top:1px solid #1f2a24;display:flex;align-items:center;justify-content:space-between}.ctrl{height:34px;min-width:92px;border:2px solid #756322;border-radius:6px;background:#111713;color:#b8b8ae;font:bold 13px monospace}.ctrl.pause{min-width:80px;color:#fff;border-color:#e1ba42}.qaBadge{position:absolute;z-index:8;right:6px;bottom:45px;background:#071018cc;border:1px solid #64717b;padding:5px 7px;font-size:9px}.readout{margin-top:10px;background:#12191f;border:1px solid #39434d;padding:9px;font-size:11px;white-space:pre-wrap}</style></head><body><main class="qa"><div class="bar"><strong>LAB25Q-derived Universal World Viewer</strong><select id="stage"></select><button id="claude">Claude</button><button id="constance">Constance</button><span class="note">Fixed geometry. Stage selector swaps assets only.</span></div><section class="game"><canvas id="world" class="world" width="480" height="270"></canvas><div class="hud"><div class="health"><div class="label">HEALTH</div><div class="hearts" id="hearts"></div></div><div class="progress"><div class="stageTitle" id="stageTitle"></div><div class="track"><img class="path" id="path"><span class="marker"><img id="marker"></span><span class="finish">⚑</span></div></div></div><img id="player" class="player"><div class="qaBadge">UNIVERSAL: FAR Y0 · MID Y45 · GROUND anchor Y400→Y205 · CONTROL 40</div><div class="controls"><button class="ctrl">SLIDE</button><button class="ctrl pause">PAUSE</button><button class="ctrl">JUMP</button></div></section><pre id="readout" class="readout">Loading…</pre></main><script src="viewer.js?v=1"></script></body></html>
