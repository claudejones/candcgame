<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>C&C World Composition QA</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e8edf2;background:#101419}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:1180px;margin:auto}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.group{display:grid;gap:4px;font-size:12px}.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}select,input[type=number]{background:#1b222a;color:#fff;border:1px solid #46515c;border-radius:6px;padding:7px}.frameWrap{background:repeating-conic-gradient(#262d34 0 25%,#1c2228 0 50%) 50%/16px 16px;padding:20px;overflow:auto;border:1px solid #46515c}.frame{position:relative;width:min(960px,100%);aspect-ratio:16/9;margin:auto;background:transparent;box-shadow:0 0 0 1px #76818c}.frame canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.readout{margin-top:12px;padding:10px;background:#171d23;border:1px solid #39434d;border-radius:6px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.note{font-size:13px;color:#b9c3cc;margin:8px 0 12px}.warn{color:#ffd166}</style>
</head>
<body><main class="app">
<h1>World Composition QA — 480×270</h1>
<p class="note">Canonical production composition. Transparent backing. The checkerboard is outside the game canvas and makes uncovered pixels obvious. No synthetic world color is used.</p>
<div class="toolbar">
<label class="group">Stage<select id="stage"></select></label>
<label class="group">FAR Y <input id="farY" type="number" value="0" step="1"></label>
<label class="group">MID Y <input id="midY" type="number" value="0" step="1"></label>
<label class="group">GROUND surface Y <input id="groundY" type="number" value="205" step="1"></label>
<button id="reset">Reset</button>
</div>
<div class="checks">
<label><input id="farOn" type="checkbox" checked> FAR</label><label><input id="midOn" type="checkbox" checked> MID</label><label><input id="groundOn" type="checkbox" checked> GROUND</label><label><input id="guides" type="checkbox" checked> Guides</label><label><input id="overscan" type="checkbox"> Overscan bounds</label>
</div>
<div class="frameWrap"><div class="frame"><canvas id="world" width="480" height="270"></canvas><canvas id="overlay" width="480" height="270"></canvas></div></div>
<div id="readout" class="readout">Loading…</div>
</main>
<script src="world-composition.js"></script>
</body></html>
