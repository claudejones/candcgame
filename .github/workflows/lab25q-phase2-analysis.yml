name: LAB25Q Phase 2 semantic asset analysis

on:
  push:
    branches: ["modular-parity-validation"]
    paths:
      - '.github/workflows/lab25q-phase2-analysis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0
      - name: Analyze semantic mappings and geometry
        shell: python
        run: |
          import re, base64, hashlib, struct, pathlib

          root=pathlib.Path('.')
          source=(root/'archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html').read_text(errors='strict')
          payloads=[]
          for m in re.finditer(r'data:image/(png|jpeg);base64,([A-Za-z0-9+/=]+)', source):
              payloads.append((m.group(1), base64.b64decode(m.group(2))))
          assert len(payloads)==62, len(payloads)

          mapping={
          0:'assets/hud/UI_LIFE_HEART.png',
          1:'assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png',
          2:'assets/hud/UI_STAGE_PROGRESS_PATH.png',
          3:'assets/worlds/europe/EU01_BG_DISTANT_GREECE.png',
          4:'assets/worlds/europe/EU01_BG_MID_GREECE.png',
          5:'assets/worlds/europe/EU01_GROUND_GREECE.png',
          6:'assets/worlds/europe/EU01_OBJECT_ATLAS_CRATE.png',
          7:'assets/worlds/europe/EU01_HAZARD_ROLLING_BARREL.png',
          8:'assets/worlds/europe/EU01_HAZARD_AEGEAN_GULLS.png',
          9:'assets/worlds/europe/EU02_BG_DISTANT_PARIS.png',
          10:'assets/worlds/europe/EU02_BG_MID_PARIS.png',
          11:'assets/worlds/europe/EU02_GROUND_PARIS.png',
          12:'assets/worlds/europe/EU02_OBJECT_ATLAS.png',
          13:'assets/worlds/europe/EU02_HAZARD_SWALLOWS.png',
          14:'assets/worlds/europe/EU03_BG_DISTANT_BARCELONA.png',
          15:'assets/worlds/europe/EU03_BG_MID_BARCELONA.png',
          16:'assets/worlds/europe/EU03_GROUND_BARCELONA.png',
          17:'assets/worlds/europe/EU03_OBJECT_ATLAS.png',
          18:'assets/worlds/europe/EU03_HAZARD_BATS.png',
          19:'assets/worlds/south-america/SA01_BG_DISTANT_AMAZON.png',
          20:'assets/worlds/south-america/SA01_BG_MID_AMAZON.png',
          21:'assets/worlds/south-america/SA01_GROUND_AMAZON.png',
          22:'assets/worlds/south-america/SA01_OBJECT_ATLAS.png',
          23:'assets/worlds/south-america/SA01_HAZARD_MACAWS.png',
          24:'assets/worlds/south-america/SA02_BG_DISTANT_ANDES.png',
          25:'assets/worlds/south-america/SA02_BG_MID_ANDES.png',
          26:'assets/worlds/south-america/SA02_GROUND_ANDES.png',
          27:'assets/worlds/south-america/SA02_OBJECT_ATLAS.png',
          28:'assets/worlds/south-america/SA02_HAZARD_ANDEAN_FLAMINGO.png',
          29:'assets/worlds/south-america/SA03_BG_DISTANT_RIO.png',
          30:'assets/worlds/south-america/SA03_BG_MID_RIO.png',
          31:'assets/worlds/south-america/SA03_GROUND_RIO.png',
          32:'assets/worlds/south-america/SA03_OBJECT_ATLAS.png',
          33:'assets/worlds/south-america/SA03_HAZARD_TROPICAL_PARAKEETS.png',
          34:'assets/shared/NA_STAGE_FINISH_MARKER.png',
          35:'assets/worlds/north-america/NA01_HAZARD_ATLAS.png',
          36:'assets/worlds/north-america/NA01_HAZARD_VULTURE.png',
          37:'assets/worlds/north-america/NA02_HAZARD_ATLAS.png',
          38:'assets/worlds/north-america/NA02_HAZARD_EAGLE.png',
          39:'assets/worlds/north-america/NA03_HAZARD_ATLAS.png',
          40:'assets/worlds/north-america/NA03_HAZARD_PIGEONS.png',
          41:'assets/characters/G1A_RUN_CYCLE_ATLAS.png',
          42:'assets/characters/G1B_IDLE_ATLAS.png',
          43:'assets/characters/G1C_JUMP_ATLAS.png',
          44:'assets/characters/G1D_SLIDE_ATLAS.png',
          45:'assets/characters/G1E_HIT_ATLAS.png',
          46:'assets/characters/G1F_CELEBRATE_ATLAS.png',
          47:'assets/characters/FX_STUN_STARS_ATLAS.png',
          48:None,
          49:'assets/worlds/north-america/NA01_BG_MID_DESERT.png',
          50:'assets/worlds/north-america/NA01_GROUND_DESERT.png',
          51:'assets/worlds/north-america/NA02_BG_DISTANT_MOUNTAINS.png',
          52:'assets/worlds/north-america/NA02_BG_MID_PINES.png',
          53:'assets/worlds/north-america/NA02_GROUND_TRAIL.png',
          54:'assets/worlds/north-america/NA03_BG_DISTANT_NYC.png',
          55:'assets/worlds/north-america/NA03_BG_MID_CITY.png',
          56:'assets/worlds/north-america/NA03_GROUND_CITY.png',
          57:'assets/worlds/north-america/NA01_BG_DISTANT_MESAS.png',
          58:'assets/shared/NA_CLOUD_LAYER.png',
          59:'assets/worlds/north-america/NA01_OBJECT_ATLAS.png',
          60:'assets/worlds/north-america/NA02_OBJECT_ATLAS.png',
          61:'assets/worlds/north-america/NA03_OBJECT_ATLAS.png'}

          roles=['HUD heart','HUD progress character','HUD progress path','EU01 FAR','EU01 MID','EU01 GROUND','EU01 objects','EU01 barrel','EU01 bird','EU02 FAR','EU02 MID','EU02 GROUND','EU02 objects','EU02 bird','EU03 FAR','EU03 MID','EU03 GROUND','EU03 objects','EU03 bird','SA01 FAR','SA01 MID','SA01 GROUND','SA01 objects','SA01 bird','SA02 FAR','SA02 MID','SA02 GROUND','SA02 objects','SA02 bird','SA03 FAR','SA03 MID','SA03 GROUND','SA03 objects','SA03 bird','finish marker','NA01 hazards','NA01 bird','NA02 hazards','NA02 bird','NA03 hazards','NA03 bird','Run','Idle','Jump','Slide','Hit','Celebrate','stun stars','shadowed duplicate `far` value','NA01 MID','NA01 GROUND','NA02 FAR','NA02 MID','NA02 GROUND','NA03 FAR','NA03 MID','NA03 GROUND','NA01 FAR (live final `far` property)','clouds','NA01 objects','NA02 objects','NA03 objects']

          def dims(data, mime):
              if mime=='png' and data[:8]==b'\x89PNG\r\n\x1a\n': return struct.unpack('>II',data[16:24])
              if mime=='jpeg':
                  i=2
                  while i < len(data)-9:
                      if data[i]!=0xff: i+=1; continue
                      marker=data[i+1]; i+=2
                      if marker in (0xd8,0xd9): continue
                      if i+2>len(data): break
                      n=struct.unpack('>H',data[i:i+2])[0]
                      if marker in range(0xc0,0xc4): return struct.unpack('>HH',data[i+3:i+7])[::-1]
                      i+=n
              return ('?','?')

          rows=[]; direct=changed=uncertain=shadowed=0
          for i,(mime,old) in enumerate(payloads):
              olddim=dims(old,mime); p=mapping[i]
              if p is None:
                  cls='C — shadowed/dead duplicate property; no runtime substitution'
                  newdim=('—','—'); exact=False; exists=True; shadowed+=1
              else:
                  f=root/p; exists=f.exists()
                  if not exists:
                      cls='C — named asset missing at expected semantic path'; newdim=('?','?'); exact=False; uncertain+=1
                  else:
                      new=f.read_bytes(); newmime='png' if new[:8]==b'\x89PNG\r\n\x1a\n' else 'jpeg'
                      newdim=dims(new,newmime); exact=hashlib.sha256(old).digest()==hashlib.sha256(new).digest()
                      if olddim==newdim:
                          cls='A — direct geometry compatible' + (' / exact bytes' if exact else ' / artwork bytes differ')
                          direct+=1
                      else:
                          cls='B — geometry changed; integration metadata/review required'; changed+=1
              rows.append((i,roles[i],f'{olddim[0]}×{olddim[1]}',p or '—',f'{newdim[0]}×{newdim[1]}',cls))

          report=['# LAB25Q Phase 2 — Semantic Asset Manifest','','Status: ANALYSIS COMPLETE — NO RUNTIME ASSETS SUBSTITUTED','',
          'Authority: `docs/LAB25Q_EXTERNALIZATION_BLUEPRINT.md`','',
          'Phase 1 visual parity was approved by the user before this analysis. This report maps by LAB25Q semantic ownership, never by occurrence order as proof. Ordinals below are navigation references back to the Phase 0 inventory only.','',
          '## Classification summary','',f'- A / same geometry: **{direct}**',f'- B / changed geometry: **{changed}**',f'- C / uncertain or missing: **{uncertain}**',f'- Shadowed/dead duplicate embedded property: **{shadowed}**','',
          '## Full mapping','','| Ref | Semantic role | LAB25Q geometry | Current named asset | Current geometry | Classification |','|---|---|---:|---|---:|---|']
          for r in rows:
              report.append(f'| IMG-{r[0]:02d} | {r[1]} | {r[2]} | `{r[3]}` | {r[4]} | {r[5]} |')
          report += ['', '## Critical findings','',
          '1. `IMG-48` is an earlier `far` property value that is overwritten later in the same AssetStore object by `IMG-57`. JavaScript uses the later property, so IMG-48 is not a live runtime asset. It must not be assigned a current named asset merely to satisfy a count.','2. `IMG-57` is the live NA01 FAR semantic owner and maps to `NA01_BG_DISTANT_MESAS.png`.','3. Current named assets are authoritative even when artwork bytes differ. Same dimensions classify only geometry compatibility; visual parity still requires the Phase 4 incremental browser gate.','4. A B classification does not authorize changing gameplay. It means inspect the real atlas/layout and adjust only the minimal asset-integration metadata if required.','5. `G1D_DUCK_ATLAS.png` and `G1B_CHARACTER_SELECT_ATLAS.png` are current repository assets but are not semantic replacements for any live LAB25Q embedded runtime payload in this manifest.','',
          '## Next gate','',
          'Do not bulk-substitute. Begin Phase 4 with HUD imagery only after this manifest is reviewed. For each system: substitute named path(s), deploy, compare against approved Phase 1, and stop on regression. Character/world/hazard systems follow only after the preceding system passes.']
          (root/'docs/LAB25Q_PHASE2_SEMANTIC_ASSET_MANIFEST.md').write_text('\n'.join(report)+'\n')
      - name: Commit Phase 2 report
        run: |
          git config user.name "claudejones"
          git config user.email "claudejones43@yahoo.com"
          git add docs/LAB25Q_PHASE2_SEMANTIC_ASSET_MANIFEST.md
          git diff --cached --quiet && exit 0
          git commit -m "Document LAB25Q Phase 2 semantic asset manifest"
          git push origin HEAD:modular-parity-validation
