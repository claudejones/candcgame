name: Landscape technical audit
on:
  push:
    paths:
      - 'tools/audit_landscapes.py'
      - 'assets-original/current-generated/**'
      - '.github/workflows/landscape-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Audit 27 landscape PNGs
        run: python tools/audit_landscapes.py | tee landscape-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: landscape-audit
          path: landscape-audit.txt
