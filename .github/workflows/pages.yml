name: Deploy QA site to GitHub Pages
on:
  workflow_run:
    workflows: ['Production CI']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current apps only
        run: |
          set -euo pipefail
          node scripts/check-workbench.mjs
          node mobile-game/verify-package.mjs mobile-game
          mkdir -p _site/workbench
          cp -R workbench/dist/. _site/workbench/
          cp -R mobile-game _site/mobile-game
          cp mobile-game/index.html _site/index.html
          sed -i 's|./play/|./mobile-game/play/|g' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
