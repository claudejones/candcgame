name: Deploy QA site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved QA build
        uses: actions/checkout@v4
        with:
          ref: dfd7cc94cbbd9b405427c6f5916a235e0d5fe167

      - name: Record deployed source SHA
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="dfd7cc94cbbd9b405427c6f5916a235e0d5fe167"
          echo "Deploying source SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - name: Build lightweight Pages bundle
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R src _site/src
          if [ -d qa/asset-compare ]; then
            mkdir -p _site/qa
            cp -R qa/asset-compare _site/qa/asset-compare
          fi
          cp -R assets _site/assets
          touch _site/.nojekyll
          printf '%s\n' 'dfd7cc94cbbd9b405427c6f5916a235e0d5fe167' > _site/DEPLOYED_SOURCE_SHA.txt
          echo "Pages bundle contents:"
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload lightweight Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Main is the only automatic Pages deployment gateway.
# Each QA deployment pins one exact validated source commit and publishes only the lightweight runtime bundle.
