name: Deploy QA site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean LAB25Q-derived build
        uses: actions/checkout@v4
        with:
          ref: modular-parity-validation

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload repository as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Pages deployment is initiated from main; deployed content is the QA branch above.
