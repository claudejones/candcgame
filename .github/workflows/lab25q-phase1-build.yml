name: LAB25Q Phase 1 lossless externalization

on:
  push:
    branches: [modular-parity-validation]
    paths:
      - 'tools/build_lab25q_phase1.py'
      - '.github/workflows/lab25q-phase1-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Phase 1 directly from immutable LAB25Q
        run: python3 tools/build_lab25q_phase1.py
      - name: Commit Phase 1 controlled build and report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src docs/LAB25Q_PHASE1_STRUCTURAL_REPORT.md
          git diff --cached --quiet || git commit -m 'Build lossless LAB25Q Phase 1 externalization'
          git pull --rebase origin modular-parity-validation
          git push origin HEAD:modular-parity-validation
