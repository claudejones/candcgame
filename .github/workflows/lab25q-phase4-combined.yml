name: LAB25Q Phase 4 combined exact-payload externalization

on:
  push:
    branches: ["modular-parity-validation"]
    paths:
      - ".github/workflows/lab25q-phase4-combined.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lab25q-phase4-combined
  cancel-in-progress: false

jobs:
  externalize-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Externalize all confirmed live LAB25Q payloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, re

          root = pathlib.Path('.')
          archive = root / 'archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html'
          source = archive.read_text(encoding='utf-8')
          rx = re.compile(r'data:image/([a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=]+)')
          matches = list(rx.finditer(source))
          if len(matches) != 62:
              raise SystemExit(f'Expected 62 archived LAB25Q payloads, found {len(matches)}')

          mapping = {
            0:'assets/hud/UI_LIFE_HEART.png',
            1:'assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png',
            2:'assets/hud/UI_STAGE_PROGRESS_PATH.png',
            3:'assets/worlds/europe/EU01_BG_DISTANT_GREECE.png',
            4:'assets/worlds/europe/EU01_BG_MID_GREECE.png',
            5:'assets/worlds/europe/EU01_GROUND_GREECE.png',
            6:'assets/worlds/europe/EU01_OBJECT_ATLAS_CRATE.png',
            7:'assets/worlds/europe/EU01_HAZARD_ROLLING_BARREL.png',
            8:'assets/worlds/europe/EU01_HAZARD_AEGEAN_GULLS.png',
            9:'assets/worlds/europe/EU02_BG_DISTANT_PARIS.png',
            10:'assets/worlds/europe/EU02_BG_MID_PARIS.png',
            11:'assets/worlds/europe/EU02_GROUND_PARIS.png',
            12:'assets/worlds/europe/EU02_OBJECT_ATLAS.png',
            13:'assets/worlds/europe/EU02_HAZARD_SWALLOWS.png',
            14:'assets/worlds/europe/EU03_BG_DISTANT_BARCELONA.png',
            15:'assets/worlds/europe/EU03_BG_MID_BARCELONA.png',
            16:'assets/worlds/europe/EU03_GROUND_BARCELONA.png',
            17:'assets/worlds/europe/EU03_OBJECT_ATLAS.png',
            18:'assets/worlds/europe/EU03_HAZARD_BATS.png',
            19:'assets/worlds/south-america/SA01_BG_DISTANT_AMAZON.png',
            20:'assets/worlds/south-america/SA01_BG_MID_AMAZON.png',
            21:'assets/worlds/south-america/SA01_GROUND_AMAZON.png',
            22:'assets/worlds/south-america/SA01_OBJECT_ATLAS.png',
            23:'assets/worlds/south-america/SA01_HAZARD_MACAWS.png',
            24:'assets/worlds/south-america/SA02_BG_DISTANT_ANDES.png',
            25:'assets/worlds/south-america/SA02_BG_MID_ANDES.png',
            26:'assets/worlds/south-america/SA02_GROUND_ANDES.png',
            27:'assets/worlds/south-america/SA02_OBJECT_ATLAS.png',
            28:'assets/worlds/south-america/SA02_HAZARD_ANDEAN_FLAMINGO.png',
            29:'assets/worlds/south-america/SA03_BG_DISTANT_RIO.png',
            30:'assets/worlds/south-america/SA03_BG_MID_RIO.png',
            31:'assets/worlds/south-america/SA03_GROUND_RIO.png',
            32:'assets/worlds/south-america/SA03_OBJECT_ATLAS.png',
            33:'assets/worlds/south-america/SA03_HAZARD_TROPICAL_PARAKEETS.png',
            34:'assets/shared/NA_STAGE_FINISH_MARKER.png',
            35:'assets/worlds/north-america/NA01_HAZARD_ATLAS.png',
            36:'assets/worlds/north-america/NA01_HAZARD_VULTURE.png',
            37:'assets/worlds/north-america/NA02_HAZARD_ATLAS.png',
            38:'assets/worlds/north-america/NA02_HAZARD_EAGLE.png',
            39:'assets/worlds/north-america/NA03_HAZARD_ATLAS.png',
            40:'assets/worlds/north-america/NA03_HAZARD_PIGEONS.png',
            41:'assets/characters/G1A_RUN_CYCLE_ATLAS.png',
            42:'assets/characters/G1B_IDLE_ATLAS.png',
            43:'assets/characters/G1C_JUMP_ATLAS.png',
            44:'assets/characters/G1D_SLIDE_ATLAS.png',
            45:'assets/characters/G1E_HIT_ATLAS.png',
            46:'assets/characters/G1F_CELEBRATE_ATLAS.png',
            47:'assets/characters/FX_STUN_STARS_ATLAS.png',
            # IMG-48 is intentionally excluded: shadowed/dead duplicate FAR.
            49:'assets/worlds/north-america/NA01_BG_MID_DESERT.png',
            50:'assets/worlds/north-america/NA01_GROUND_DESERT.png',
            51:'assets/worlds/north-america/NA02_BG_DISTANT_MOUNTAINS.png',
            52:'assets/worlds/north-america/NA02_BG_MID_PINES.png',
            53:'assets/worlds/north-america/NA02_GROUND_TRAIL.png',
            54:'assets/worlds/north-america/NA03_BG_DISTANT_NYC.png',
            55:'assets/worlds/north-america/NA03_BG_MID_CITY.png',
            56:'assets/worlds/north-america/NA03_GROUND_CITY.png',
            57:'assets/worlds/north-america/NA01_BG_DISTANT_MESAS.png',
            58:'assets/shared/NA_CLOUD_LAYER.png',
            59:'assets/worlds/north-america/NA01_OBJECT_ATLAS.png',
            60:'assets/worlds/north-america/NA02_OBJECT_ATLAS.png',
            61:'assets/worlds/north-america/NA03_OBJECT_ATLAS.png',
          }
          if len(mapping) != 61 or 48 in mapping:
              raise SystemExit('Mapping must contain exactly 61 live payloads and exclude IMG-48')

          runtime_files = [p for p in (root/'src').rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.css'}]
          before = {p: p.read_text(encoding='utf-8') for p in runtime_files}
          extracted = []
          replacements = []

          for idx, rel in mapping.items():
              m = matches[idx]
              data_uri = m.group(0)
              payload = base64.b64decode(m.group(2))
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              if target.read_bytes() != payload:
                  raise SystemExit(f'Byte identity failure for IMG-{idx:02d} -> {rel}')
              extracted.append((idx, rel, len(payload), hashlib.sha256(payload).hexdigest()))

              replacement = '../' + rel
              count = 0
              for path in runtime_files:
                  text = path.read_text(encoding='utf-8')
                  n = text.count(data_uri)
                  if n:
                      path.write_text(text.replace(data_uri, replacement), encoding='utf-8')
                      count += n
              # IMG-00..02 may already have been externalized by prior HUD gates.
              if idx <= 2:
                  if count not in (0,1):
                      raise SystemExit(f'Unexpected replacement count for already-gated IMG-{idx:02d}: {count}')
              elif count != 1:
                  raise SystemExit(f'Expected one live replacement for IMG-{idx:02d}, got {count}')
              replacements.append((idx, rel, count))

          # IMG-48 is dead/shadowed in LAB25Q. Its payload may remain in source text, but no live mapped payload may remain.
          remaining_live = []
          for idx in mapping:
              uri = matches[idx].group(0)
              n = sum(p.read_text(encoding='utf-8').count(uri) for p in runtime_files)
              if n:
                  remaining_live.append((idx,n))
          if remaining_live:
              raise SystemExit(f'Live mapped data URIs remain: {remaining_live}')

          total_data = sum(p.read_text(encoding='utf-8').count('data:image/') for p in runtime_files)
          dead_uri = matches[48].group(0)
          dead_count = sum(p.read_text(encoding='utf-8').count(dead_uri) for p in runtime_files)
          if total_data != dead_count:
              raise SystemExit(f'Unexpected embedded payloads remain: total={total_data}, dead48={dead_count}')

          # Verify runtime edits are substitution-only: reverse external paths back to their archived data URIs.
          # This proves no renderer/gameplay/config text was changed by this workflow.
          for path in runtime_files:
              text = path.read_text(encoding='utf-8')
              restored = text
              for idx, rel in mapping.items():
                  restored = restored.replace('../'+rel, matches[idx].group(0))
              # HUD Gate A/B predated this workflow, so compare after restoring all known paths.
              original_like = before[path]
              for idx, rel in mapping.items():
                  original_like = original_like.replace('../'+rel, matches[idx].group(0))
              if restored != original_like:
                  raise SystemExit(f'Non-substitution runtime change detected in {path}')

          report = root/'docs/LAB25Q_PHASE4_COMBINED_REPORT.md'
          lines = [
            '# LAB25Q Phase 4 — Combined Exact-Payload Externalization Report','',
            'Generated by `.github/workflows/lab25q-phase4-combined.yml`.','',
            '- Archived payload count: 62',
            '- Confirmed live mappings externalized: 61',
            '- IMG-48: intentionally excluded as shadowed/dead duplicate FAR',
            f'- Remaining live mapped `data:image` references: 0',
            f'- Remaining total `data:image` references: {total_data} (IMG-48 dead/shadowed only)',
            '- Asset bytes: exact decode of immutable LAB25Q payloads',
            '- Runtime changes: path substitutions only; no renderer/gameplay/config/calibration edits',
            '- Landscape regeneration: not performed; separate later production phase','',
            '## Extracted assets','',
            '| Ref | Path | Bytes | SHA-256 |','|---|---|---:|---|'
          ]
          for idx, rel, size, sha in extracted:
              lines.append(f'| IMG-{idx:02d} | `{rel}` | {size} | `{sha}` |')
          report.write_text('\n'.join(lines)+'\n', encoding='utf-8')
          print(f'Externalized {len(extracted)} live assets.')
          print(f'Remaining embedded payloads: {total_data}; dead IMG-48 occurrences: {dead_count}.')
          print('Combined Phase 4 extraction validation passed.')
          PY

      - name: Commit combined Phase 4 build
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets src docs/LAB25Q_PHASE4_COMBINED_REPORT.md
          git commit -m "Complete LAB25Q Phase 4 exact-payload externalization"
          git push origin HEAD:modular-parity-validation
