name: LAB25Q Phase 4 QA correction

on:
  push:
    branches: ["modular-parity-validation"]
    paths:
      - ".github/workflows/lab25q-phase4-qa-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Correct HUD URL resolution and remove dead embedded payload
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index=Path('src/index.html')
          css=Path('src/css/lab25q.css')
          js=Path('src/js/lab25q.js')

          h=index.read_text()
          old='id="gameplayHud" style="--heart-sprite:url(\'../assets/hud/UI_LIFE_HEART.png\');--character-sprite:url(\'../assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png\')"'
          new='id="gameplayHud"'
          if old not in h:
              raise SystemExit('Expected inline HUD sprite variables not found')
          h=h.replace(old,new,1)
          index.write_text(h)

          c=css.read_text()
          old_css='.gameplay-hud{position:absolute;inset:0;z-index:8;pointer-events:none;font-family:ui-monospace,monospace}'
          new_css=".gameplay-hud{--heart-sprite:url('../../assets/hud/UI_LIFE_HEART.png');--character-sprite:url('../../assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png');position:absolute;inset:0;z-index:8;pointer-events:none;font-family:ui-monospace,monospace}"
          if old_css not in c:
              raise SystemExit('Expected gameplay HUD CSS rule not found')
          c=c.replace(old_css,new_css,1)
          css.write_text(c)

          j=js.read_text()
          before_bytes=len(j.encode())
          # IMG-48 is the already-proven shadowed/dead first `far` property. Remove only that
          # obsolete data-URI property; the later live `far` property remains untouched.
          pat=re.compile(r'\n far:"data:image/jpeg;base64,[A-Za-z0-9+/=]+",')
          j2,n=pat.subn('',j,count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one dead IMG-48 property, removed {n}')
          if 'data:image/' in j2:
              raise SystemExit('Unexpected embedded data:image payload remains after IMG-48 cleanup')
          if 'far:"../assets/worlds/north-america/NA01_BG_DISTANT_MESAS.png"' not in j2:
              raise SystemExit('Live NA01 FAR mapping missing after dead-property cleanup')
          js.write_text(j2)
          after_bytes=len(j2.encode())
          print(f'lab25q.js bytes: {before_bytes} -> {after_bytes}; removed {before_bytes-after_bytes} bytes of dead embedded payload')

          # Deterministic QA assertions.
          h=index.read_text(); c=css.read_text(); j=js.read_text()
          assert "../assets/hud/UI_STAGE_PROGRESS_PATH.png" in h
          assert "../../assets/hud/UI_LIFE_HEART.png" in c
          assert "../../assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png" in c
          assert "data:image/" not in h
          assert "data:image/" not in c
          assert "data:image/" not in j
          print('HUD path and zero-data-URI assertions passed.')
          PY

      - name: Commit verified correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/css/lab25q.css src/js/lab25q.js
          git diff --cached --check
          git commit -m "Fix Phase 4 HUD sprites and remove dead embedded payload"
          git push origin HEAD:modular-parity-validation
