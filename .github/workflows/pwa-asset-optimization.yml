name: PWA asset optimization lab
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lossless optimization tools
        run: sudo apt-get update && sudo apt-get install -y optipng webp imagemagick ffmpeg
      - name: Analyze lossless image optimization
        run: bash tools/pwa-optimize-assets.sh mobile-game pwa-optimization-report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pwa-optimization-report
          path: |
            pwa-optimization-report/summary.json
            pwa-optimization-report/image-results.csv
          retention-days: 14
