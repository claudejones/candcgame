name: PWA asset optimization lab
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pwa-asset-optimization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cancel superseded optimization runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          mapfile -t old_runs < <(gh run list --workflow pwa-asset-optimization.yml --branch "$branch" --limit 100 --json databaseId,status --jq '.[] | select(.databaseId != (env.GITHUB_RUN_ID | tonumber)) | select(.status == "in_progress" or .status == "queued") | .databaseId')
          for run_id in "${old_runs[@]}"; do
            echo "Cancelling superseded optimization run $run_id"
            gh run cancel "$run_id" || true
          done
      - name: Install bounded benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng webp imagemagick ffmpeg
      - name: Benchmark lossless image options and inventory audio
        env:
          PWA_BENCH_WORKERS: 4
        run: python3 tools/pwa-optimize-assets.py mobile-game pwa-optimization-report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pwa-optimization-report
          path: |
            pwa-optimization-report/summary.json
            pwa-optimization-report/image-results.csv
          retention-days: 14
