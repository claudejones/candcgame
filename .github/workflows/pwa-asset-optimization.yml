name: PWA asset optimization lab
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: pwa-asset-optimization-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install bounded benchmark tools
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng webp imagemagick ffmpeg
      - name: Benchmark lossless image options and inventory audio
        env:
          PWA_BENCH_WORKERS: 4
        run: python3 tools/pwa-optimize-assets.py mobile-game pwa-optimization-report
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: pwa-optimization-report
          path: |
            pwa-optimization-report/summary.json
            pwa-optimization-report/image-results.csv
          retention-days: 14
