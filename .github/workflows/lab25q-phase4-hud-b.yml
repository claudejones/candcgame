name: LAB25Q Phase 4 HUD exact-payload gate

on:
  push:
    branches: ["modular-parity-validation"]
    paths:
      - ".github/workflows/lab25q-phase4-hud-b.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  externalize-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Externalize exact LAB25Q HUD progress-path payload
        run: |
          python3 - <<'PY'
          import base64, pathlib, re, sys

          root = pathlib.Path('.')
          archive = root / 'archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html'
          source = archive.read_text(encoding='utf-8')
          rx = re.compile(r'data:image/([a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=]+)')
          matches = list(rx.finditer(source))
          if len(matches) != 62:
              raise SystemExit(f'Expected 62 LAB25Q payloads, found {len(matches)}')

          # IMG-02 is the user-confirmed HUD progress path.
          m = matches[2]
          data_uri = m.group(0)
          payload = base64.b64decode(m.group(2))
          target = root / 'assets/hud/UI_STAGE_PROGRESS_PATH.png'
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(payload)

          # Replace the exact archived payload wherever it still occurs in the Phase 1 runtime.
          changed = []
          replacement = '../assets/hud/UI_STAGE_PROGRESS_PATH.png'
          for path in (root / 'src').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.html','.js','.css'}:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count(data_uri)
              if count:
                  path.write_text(text.replace(data_uri, replacement), encoding='utf-8')
                  changed.append((str(path), count))

          if sum(c for _, c in changed) != 1:
              raise SystemExit(f'Expected exactly one live IMG-02 replacement, got {changed}')

          # Prove extracted file is byte-identical to the archived payload.
          if target.read_bytes() != payload:
              raise SystemExit('Extracted HUD progress path is not byte-identical')

          # Gate A already externalized IMG-00 and IMG-01. HUD should now have no embedded image payloads in markup.
          remaining_html = 0
          for path in (root / 'src').rglob('*'):
              if path.is_file() and path.suffix.lower() in {'.html','.js','.css'}:
                  remaining_html += path.read_text(encoding='utf-8').count('data:image/')
          print('Changed:', changed)
          print('Remaining embedded runtime payloads:', remaining_html)
          print('HUD Gate B complete; no renderer/config/gameplay changes performed.')
          PY

      - name: Commit HUD Gate B
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hud/UI_STAGE_PROGRESS_PATH.png src
          git commit -m "Externalize exact LAB25Q HUD progress path"
          git push origin HEAD:modular-parity-validation
