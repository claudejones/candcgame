name: LAB25Q source extraction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lab25q-extract.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build faithful LAB25Q with current named assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          src=Path('archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html')
          s=src.read_text(errors='replace')
          parity=Path('qa/lab25q-faithful'); parity.mkdir(parents=True,exist_ok=True)
          shutil.rmtree(parity/'assets',ignore_errors=True)
          root='../../assets-original/current-generated/'

          # LAB25Q contains 62 embedded image occurrences. Their order is stable in the
          # preserved reference. The current named uploaded assets are production authority;
          # embedded bytes are historical snapshots and are never retained as fallbacks.
          rel=[
            'HUD/UI_LIFE_HEART.png','HUD/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png','HUD/UI_STAGE_PROGRESS_PATH.png',
            'EU-assets/EU01_BG_DISTANT_GREECE.png','EU-assets/EU01_BG_MID_GREECE.png','EU-assets/EU01_GROUND_GREECE.png','EU-assets/EU01_OBJECT_ATLAS_CRATE.png','EU-assets/EU01_HAZARD_ROLLING_BARREL.png','EU-assets/EU01_HAZARD_AEGEAN_GULLS.png',
            'EU-assets/EU02_BG_DISTANT_PARIS.png','EU-assets/EU02_BG_MID_PARIS.png','EU-assets/EU02_GROUND_PARIS.png','EU-assets/EU02_OBJECT_ATLAS.png','EU-assets/EU02_HAZARD_SWALLOWS.png',
            'EU-assets/EU03_BG_DISTANT_BARCELONA.png','EU-assets/EU03_BG_MID_BARCELONA.png','EU-assets/EU03_GROUND_BARCELONA.png','EU-assets/EU03_OBJECT_ATLAS.png','EU-assets/EU03_HAZARD_BATS.png',
            'SA-assets/SA01_BG_DISTANT_AMAZON.png','SA-assets/SA01_BG_MID_AMAZON.png','SA-assets/SA01_GROUND_AMAZON.png','SA-assets/SA01_OBJECT_ATLAS.png','SA-assets/SA01_HAZARD_MACAWS.png',
            'SA-assets/SA02_BG_DISTANT_ANDES.png','SA-assets/SA02_BG_MID_ANDES.png','SA-assets/SA02_GROUND_ANDES.png','SA-assets/SA02_OBJECT_ATLAS.png','SA-assets/SA02_HAZARD_ANDEAN_FLAMINGO.png',
            'SA-assets/SA03_BG_DISTANT_RIO.png','SA-assets/SA03_BG_MID_RIO.png','SA-assets/SA03_GROUND_RIO.png','SA-assets/SA03_OBJECT_ATLAS.png','SA-assets/SA03_HAZARD_TROPICAL_PARAKEETS.png',
            'NA_STAGE_FINISH_MARKER.png','NA-assets/NA01_HAZARD_ATLAS.png','NA-assets/NA01_HAZARD_VULTURE.png','NA-assets/NA02_HAZARD_ATLAS.png','NA-assets/NA02_HAZARD_EAGLE.png','NA-assets/NA03_HAZARD_ATLAS.png','NA-assets/NA03_HAZARD_PIGEONS.png',
            'characer-states/G1A_RUN_CYCLE_ATLAS.png','characer-states/G1B_IDLE_ATLAS.png','characer-states/G1C_JUMP_ATLAS.png','characer-states/G1D_SLIDE_ATLAS.png','characer-states/G1E_HIT_ATLAS.png','characer-states/G1F_CELEBRATE_ATLAS.png','characer-states/FX_STUN_STARS_ATLAS.png',
            'NA-assets/NA01_BG_DISTANT_MESAS.png','NA-assets/NA01_BG_MID_DESERT.png','NA-assets/NA01_GROUND_DESERT.png',
            'NA-assets/NA02_BG_DISTANT_MOUNTAINS.png','NA-assets/NA02_BG_MID_PINES.png','NA-assets/NA02_GROUND_TRAIL.png',
            'NA-assets/NA03_BG_DISTANT_NYC.png','NA-assets/NA03_BG_MID_CITY.png','NA-assets/NA03_GROUND_CITY.png',
            'NA-assets/NA01_BG_DISTANT_MESAS.png','NA_CLOUD_LAYER.png',
            'NA-assets/NA01_HAZARD_ATLAS.png','NA-assets/NA02_HAZARD_ATLAS.png','NA-assets/NA03_HAZARD_ATLAS.png'
          ]
          pat=re.compile(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+',re.I)
          occ=list(pat.finditer(s))
          if len(occ)!=62 or len(rel)!=62:
              raise SystemExit(f'LAB25Q image contract mismatch: source={len(occ)} map={len(rel)}')
          missing=[p for p in rel if not Path('assets-original/current-generated',p).is_file()]
          if missing: raise SystemExit('Missing named assets: '+', '.join(missing))
          it=iter(root+p for p in rel)
          rebuilt=pat.sub(lambda m:next(it),s)

          styles=re.findall(r'<style[^>]*>(.*?)</style>',rebuilt,re.I|re.S)
          scripts=re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>',rebuilt,re.I|re.S)
          css='\n\n/* ---- source style block ---- */\n'.join(styles)
          js='\n\n// ---- source script block ----\n'.join(scripts)
          body_match=re.search(r'<body([^>]*)>(.*?)</body>',rebuilt,re.I|re.S)
          if not body_match: raise SystemExit('LAB25Q body not found')
          body_attrs,body=body_match.group(1),body_match.group(2)
          body=re.sub(r'<script(?![^>]*\\bsrc=)[^>]*>.*?</script>','',body,flags=re.I|re.S)
          head_match=re.search(r'<head[^>]*>(.*?)</head>',rebuilt,re.I|re.S)
          head=head_match.group(1) if head_match else ''
          head=re.sub(r'<style[^>]*>.*?</style>','',head,flags=re.I|re.S)
          head=re.sub(r'<script(?![^>]*\\bsrc=)[^>]*>.*?</script>','',head,flags=re.I|re.S)
          (parity/'lab25q.css').write_text(css)
          (parity/'lab25q.js').write_text(js)
          (parity/'index.html').write_text('<!doctype html><html><head>'+head+'<link rel="stylesheet" href="./lab25q.css"></head><body'+body_attrs+'>'+body+'<script src="./lab25q.js"></script></body></html>')

          report=['# LAB25Q Named Asset Map','',
            '- Archived LAB25Q image occurrences: **62**',
            '- Generated embedded/base64 images: **0**',
            '- Anonymous fallback images: **0**',
            '- Asset authority: `assets-original/current-generated/` (current named uploaded assets)',
            '- Archived LAB25Q remains immutable.','',
            '## Reference map','']
          for i,p in enumerate(rel): report.append(f'- #{i:02d} -> `{p}`')
          report += ['', '## Historical-only entries still present in LAB25Q code','',
            '- The earlier duplicate `far` property is mapped to the current `NA01_BG_DISTANT_MESAS.png`; the later `far` property still wins exactly as in LAB25Q.',
            '- `na01Objects`, `na02Objects`, and `na03Objects` are mapped to the current named NA hazard atlases. They are retained for parity until dead-code removal is separately verified.',
            '- `G1D_DUCK_ATLAS.png` is not referenced; Slide maps to current `G1D_SLIDE_ATLAS.png`.']
          Path('docs/LAB25Q_EXTRACTION_MAP.md').write_text('\n'.join(report))
          PY
      - name: Validate named-asset extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          files=[Path('qa/lab25q-faithful/index.html'),Path('qa/lab25q-faithful/lab25q.css'),Path('qa/lab25q-faithful/lab25q.js')]
          text='\n'.join(p.read_text(errors='replace') for p in files)
          fail=[]
          if 'data:image/' in text: fail.append('embedded data URL remains')
          if 'assets/unmatched' in text: fail.append('anonymous fallback reference remains')
          if Path('qa/lab25q-faithful/assets').exists(): fail.append('anonymous fallback directory remains')
          for marker in ['gameplay-hud','qaFarToggle','saveLocalConfig','CC_WORLD_QA_LOCAL_CONFIG_14_SIGNATURE_VISUAL_QUEUE']:
              if marker not in text: fail.append('missing LAB25Q marker: '+marker)
          refs=set(re.findall(r'\.\./\.\./assets-original/current-generated/[^\"\'\)\s]+',text))
          for ref in refs:
              disk=Path(ref.replace('../../','',1))
              if not disk.is_file(): fail.append('broken asset ref: '+ref)
          if fail:
              print('\n'.join('FAIL: '+x for x in fail));sys.exit(1)
          print(f'PASS: named-asset LAB25Q build; {len(refs)} unique current asset files referenced; zero embedded/fallback images.')
          PY
      - name: Commit named-asset parity build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A qa/lab25q-faithful docs/LAB25Q_EXTRACTION_MAP.md
          git diff --cached --quiet || git commit -m 'Build LAB25Q against current named assets only'
          git push
