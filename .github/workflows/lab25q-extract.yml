name: LAB25Q mechanical source extraction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/lab25q-extract.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild one clean source tree directly from archived LAB25Q
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          source = Path('archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html')
          html = source.read_text(errors='strict')

          # Remove superseded implementations. Preservation areas are never touched.
          shutil.rmtree('src', ignore_errors=True)
          shutil.rmtree('qa', ignore_errors=True)
          for p in Path('assets').rglob('.DS_Store'):
              p.unlink()

          out = Path('src')
          (out/'css').mkdir(parents=True)
          (out/'js').mkdir(parents=True)

          # Current named assets are authoritative. Occurrence order is locked to archived LAB25Q.
          rel = [
            'hud/UI_LIFE_HEART.png','hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png','hud/UI_STAGE_PROGRESS_PATH.png',
            'worlds/europe/EU01_BG_DISTANT_GREECE.png','worlds/europe/EU01_BG_MID_GREECE.png','worlds/europe/EU01_GROUND_GREECE.png','worlds/europe/EU01_OBJECT_ATLAS_CRATE.png','worlds/europe/EU01_HAZARD_ROLLING_BARREL.png','worlds/europe/EU01_HAZARD_AEGEAN_GULLS.png',
            'worlds/europe/EU02_BG_DISTANT_PARIS.png','worlds/europe/EU02_BG_MID_PARIS.png','worlds/europe/EU02_GROUND_PARIS.png','worlds/europe/EU02_OBJECT_ATLAS.png','worlds/europe/EU02_HAZARD_SWALLOWS.png',
            'worlds/europe/EU03_BG_DISTANT_BARCELONA.png','worlds/europe/EU03_BG_MID_BARCELONA.png','worlds/europe/EU03_GROUND_BARCELONA.png','worlds/europe/EU03_OBJECT_ATLAS.png','worlds/europe/EU03_HAZARD_BATS.png',
            'worlds/south-america/SA01_BG_DISTANT_AMAZON.png','worlds/south-america/SA01_BG_MID_AMAZON.png','worlds/south-america/SA01_GROUND_AMAZON.png','worlds/south-america/SA01_OBJECT_ATLAS.png','worlds/south-america/SA01_HAZARD_MACAWS.png',
            'worlds/south-america/SA02_BG_DISTANT_ANDES.png','worlds/south-america/SA02_BG_MID_ANDES.png','worlds/south-america/SA02_GROUND_ANDES.png','worlds/south-america/SA02_OBJECT_ATLAS.png','worlds/south-america/SA02_HAZARD_ANDEAN_FLAMINGO.png',
            'worlds/south-america/SA03_BG_DISTANT_RIO.png','worlds/south-america/SA03_BG_MID_RIO.png','worlds/south-america/SA03_GROUND_RIO.png','worlds/south-america/SA03_OBJECT_ATLAS.png','worlds/south-america/SA03_HAZARD_TROPICAL_PARAKEETS.png',
            'shared/NA_STAGE_FINISH_MARKER.png','worlds/north-america/NA01_HAZARD_ATLAS.png','worlds/north-america/NA01_HAZARD_VULTURE.png','worlds/north-america/NA02_HAZARD_ATLAS.png','worlds/north-america/NA02_HAZARD_EAGLE.png','worlds/north-america/NA03_HAZARD_ATLAS.png','worlds/north-america/NA03_HAZARD_PIGEONS.png',
            'characters/G1A_RUN_CYCLE_ATLAS.png','characters/G1B_IDLE_ATLAS.png','characters/G1C_JUMP_ATLAS.png','characters/G1D_SLIDE_ATLAS.png','characters/G1E_HIT_ATLAS.png','characters/G1F_CELEBRATE_ATLAS.png','characters/FX_STUN_STARS_ATLAS.png',
            'worlds/north-america/NA01_BG_DISTANT_MESAS.png','worlds/north-america/NA01_BG_MID_DESERT.png','worlds/north-america/NA01_GROUND_DESERT.png',
            'worlds/north-america/NA02_BG_DISTANT_MOUNTAINS.png','worlds/north-america/NA02_BG_MID_PINES.png','worlds/north-america/NA02_GROUND_TRAIL.png',
            'worlds/north-america/NA03_BG_DISTANT_NYC.png','worlds/north-america/NA03_BG_MID_CITY.png','worlds/north-america/NA03_GROUND_CITY.png',
            'worlds/north-america/NA01_BG_DISTANT_MESAS.png','shared/NA_CLOUD_LAYER.png',
            'worlds/north-america/NA01_HAZARD_ATLAS.png','worlds/north-america/NA02_HAZARD_ATLAS.png','worlds/north-america/NA03_HAZARD_ATLAS.png'
          ]
          image_pat = re.compile(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+', re.I)
          occurrences = list(image_pat.finditer(html))
          if len(occurrences) != 62 or len(rel) != 62:
              raise SystemExit(f'Image contract mismatch: source={len(occurrences)} map={len(rel)}')
          missing = [p for p in sorted(set(rel)) if not Path('assets',p).is_file()]
          if missing:
              raise SystemExit('Missing current named assets:\n' + '\n'.join(missing))
          paths = iter('../assets/' + p for p in rel)
          html = image_pat.sub(lambda m: next(paths), html)

          # Mechanical externalization: replace each inline STYLE/SCRIPT exactly where it occurs.
          # Do not concatenate or move scripts: preserving source position preserves execution timing.
          style_n = 0
          script_n = 0
          token_pat = re.compile(r'<style(?P<sa>[^>]*)>(?P<css>.*?)</style>|<script(?P<ja>(?![^>]*\\bsrc=)[^>]*)>(?P<js>.*?)</script>', re.I|re.S)
          def externalize(m):
              global style_n, script_n
              if m.group('css') is not None:
                  style_n += 1
                  name = f'lab25q-{style_n:02d}.css'
                  (out/'css'/name).write_text(m.group('css'))
                  return f'<link rel="stylesheet" href="./css/{name}">'
              script_n += 1
              name = f'lab25q-{script_n:02d}.js'
              (out/'js'/name).write_text(m.group('js'))
              return f'<script src="./js/{name}"></script>'
          rebuilt = token_pat.sub(externalize, html)
          (out/'index.html').write_text(rebuilt)

          Path('docs/LAB25Q_EXTRACTION_MAP.md').write_text(
              '# LAB25Q Mechanical Extraction\n\n'
              f'- Source: `{source}`\n'
              f'- Embedded image occurrences replaced: **{len(rel)}**\n'
              f'- External CSS blocks: **{style_n}**\n'
              f'- External JavaScript blocks: **{script_n}**\n'
              '- HTML/DOM order: preserved from LAB25Q.\n'
              '- CSS block order/content: preserved; only externalized.\n'
              '- JavaScript block order/content: preserved; only externalized.\n'
              '- Asset authority: `assets/` current named files.\n'
              '- `archive/` and `assets-original/`: untouched.\n'
              '- Superseded `qa/` builds and previous `src/` shell: removed.\n\n'
              '## Image map\n\n' + '\n'.join(f'- #{i:02d} → `assets/{p}`' for i,p in enumerate(rel)) + '\n'
          )
          print(f'Extracted LAB25Q mechanically: {style_n} CSS blocks, {script_n} JS blocks, 62 image references.')
          PY

      - name: Validate structural parity and repository cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          src = Path('archive/LAB25Q/CHARACTER_STATE_LAB_25Q_WORLD_VISUAL_OWNERSHIP_QA.html').read_text(errors='strict')
          built = Path('src/index.html').read_text(errors='strict')
          fail=[]
          if Path('qa').exists(): fail.append('superseded qa directory remains')
          if 'data:image/' in built: fail.append('embedded image remains in generated HTML')
          if 'assets-original/' in built: fail.append('runtime still references preservation assets')
          if 'assets/unmatched' in built: fail.append('anonymous fallback reference remains')
          for p in Path('src').rglob('*'):
              if p.is_file() and p.suffix in ('.js','.css','.html'):
                  t=p.read_text(errors='replace')
                  if 'data:image/' in t: fail.append(f'embedded image remains: {p}')
          for marker in ['gameplay-hud','debugPanel','tunerPanel','gameplayActions','qaFarToggle','saveLocalConfig','CC_WORLD_QA_LOCAL_CONFIG_14_SIGNATURE_VISUAL_QUEUE']:
              if marker not in (built + '\n' + '\n'.join(p.read_text(errors='replace') for p in Path('src/js').glob('*.js'))):
                  fail.append('missing LAB25Q marker: '+marker)
          # Exact non-payload DOM token counts must survive.
          for token in ['id="game"','id="debugPanel"','id="tunerPanel"','class="tuner collapsed"','id="gameSlideBtn"','id="gamePauseBtn"','id="gameJumpBtn"']:
              if built.count(token) != src.count(token): fail.append('DOM parity count mismatch: '+token)
          if fail:
              print('\n'.join('FAIL: '+x for x in fail)); sys.exit(1)
          print('PASS: one clean LAB25Q-derived source tree; DOM markers preserved; no embedded/fallback/preservation asset references.')
          PY

      - name: Commit clean LAB25Q-derived source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src qa assets docs/LAB25Q_EXTRACTION_MAP.md
          git diff --cached --quiet || git commit -m 'Replace experimental shells with mechanical LAB25Q extraction'
          git push
