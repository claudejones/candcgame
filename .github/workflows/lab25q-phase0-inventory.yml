name: LAB25Q Phase 0 exact source inventory

on:
  push:
    branches: [modular-parity-validation]
    paths:
      - 'tools/analyze_lab25q.py'
      - '.github/workflows/lab25q-phase0-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze immutable LAB25Q
        run: python3 tools/analyze_lab25q.py
      - name: Commit Phase 0 manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/LAB25Q_PHASE0_SOURCE_MANIFEST.md
          git diff --cached --quiet || git commit -m 'Document LAB25Q Phase 0 exact source manifest'
          git pull --rebase origin modular-parity-validation
          git push origin HEAD:modular-parity-validation
