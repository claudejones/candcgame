name: Phase 6 production cleanup

on:
  push:
    branches: ["modular-parity-validation"]
    paths: [".github/workflows/lab25q-phase5-modularize.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Verify approved Phase 5 baseline
        run: |
          set -euo pipefail
          test -f src/js/lab25q-config.js
          test -f src/js/lab25q-runtime.js
          test -f src/js/lab25q.js
          test -f src/css/lab25q.css
          grep -q 'window.LAB25Q_CONFIG' src/js/lab25q-config.js
          grep -q 'const CONFIG=window.LAB25Q_CONFIG' src/js/lab25q-runtime.js
          grep -q './js/lab25q-config.js' src/index.html
          grep -q './js/lab25q-runtime.js' src/index.html
          ! grep -q 'data:image/' src/index.html src/css/lab25q.css src/js/lab25q-config.js src/js/lab25q-runtime.js

      - name: Rename production files and remove legacy duplicate
        run: |
          set -euo pipefail
          mv src/css/lab25q.css src/css/game.css
          mv src/js/lab25q-config.js src/js/game-config.js
          mv src/js/lab25q-runtime.js src/js/game-runtime.js
          rm src/js/lab25q.js

          sed -i 's/window\.LAB25Q_CONFIG/window.GAME_CONFIG/g' src/js/game-config.js src/js/game-runtime.js
          sed -i 's#\./css/lab25q\.css#./css/game.css#g' src/index.html
          sed -i 's#\./js/lab25q-config\.js#./js/game-config.js#g' src/index.html
          sed -i 's#\./js/lab25q-runtime\.js#./js/game-runtime.js#g' src/index.html

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/index.html')
          s=p.read_text()
          marker='<div class="status" id="status">'
          assert marker in s
          s=s.replace(marker,'<div class="build-id" id="buildId">PHASE 6 • QA</div>\n'+marker,1)
          p.write_text(s)
          css=Path('src/css/game.css')
          c=css.read_text()
          c += '\n.build-id{font-size:10px;letter-spacing:.08em;opacity:.68;text-align:right;margin:4px 2px 0;font-weight:700;}\n'
          css.write_text(c)
          PY

      - name: Remove completed migration-only workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/lab25q-phase0-inventory.yml
          rm -f .github/workflows/lab25q-phase1-build.yml
          rm -f .github/workflows/lab25q-phase2-analysis.yml
          rm -f .github/workflows/lab25q-phase4-combined.yml
          rm -f .github/workflows/lab25q-phase4-hud-a.yml
          rm -f .github/workflows/lab25q-phase4-hud-b.yml
          rm -f .github/workflows/lab25q-phase4-qa-fix.yml
          rm -f .github/workflows/lab25q-phase5-modularize.yml

      - name: Phase 6 structural QA
        run: |
          set -euo pipefail
          test -f src/css/game.css
          test -f src/js/game-config.js
          test -f src/js/game-runtime.js
          test ! -e src/css/lab25q.css
          test ! -e src/js/lab25q-config.js
          test ! -e src/js/lab25q-runtime.js
          test ! -e src/js/lab25q.js
          grep -q 'window.GAME_CONFIG=' src/js/game-config.js
          grep -q 'const CONFIG=window.GAME_CONFIG;' src/js/game-runtime.js
          grep -q './css/game.css' src/index.html
          grep -q './js/game-config.js' src/index.html
          grep -q './js/game-runtime.js' src/index.html
          grep -q 'PHASE 6 • QA' src/index.html
          ! grep -R -nE 'LAB25Q_CONFIG|src/(css|js)/lab25q|data:image/' src
          ! grep -R -nE 'lab25q-(phase0|phase1|phase2|phase4|phase5)' .github/workflows || true
          grep -q 'slideDuration:.75' src/js/game-config.js
          grep -q 'recoveryDuration:1.10' src/js/game-config.js
          grep -q 'invulnerabilityDuration:2.00' src/js/game-config.js
          grep -q 'characterX:220' src/js/game-config.js
          grep -q 'worldSpeed:120' src/js/game-config.js
          node --check src/js/game-config.js
          node --check src/js/game-runtime.js

      - name: Commit Phase 6 production baseline
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Phase 6 establish production runtime baseline'
          git push origin HEAD:modular-parity-validation
