name: LAB25Q Phase 5 modularization

on:
  push:
    branches: ["modular-parity-validation"]
    paths: [".github/workflows/lab25q-phase5-modularize.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Split proven Phase 4 runtime without changing execution order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('src/js/lab25q.js')
          html = Path('src/index.html')
          text = js.read_text()

          # Phase 5 intentionally uses ordered classic scripts. Splitting occurs only at
          # top-level declaration boundaries so the browser executes the exact same source
          # statements in the exact same order and shared lexical bindings remain available.
          marker = '\nclass AssetStore{'
          if marker not in text:
              raise SystemExit('AssetStore boundary not found')
          config, runtime = text.split(marker, 1)
          runtime = 'class AssetStore{' + runtime

          # Preserve the original IIFE strict-mode envelope across the ordered files:
          # open it in config, close it in runtime. No statement is rewritten.
          Path('src/js/lab25q-config.js').write_text(config)
          Path('src/js/lab25q-runtime.js').write_text(runtime)

          h = html.read_text()
          old = '<script src="js/lab25q.js"></script>'
          new = '<script src="js/lab25q-config.js"></script>\n<script src="js/lab25q-runtime.js"></script>'
          if old not in h:
              raise SystemExit('lab25q script tag not found')
          html.write_text(h.replace(old, new, 1))

          # Mechanical parity assertion: concatenating modules must reproduce original JS
          # byte-for-byte. This prevents accidental gameplay/config/render changes.
          rebuilt = Path('src/js/lab25q-config.js').read_text() + Path('src/js/lab25q-runtime.js').read_text()
          assert rebuilt == text, 'module concatenation differs from Phase 4 source'
          assert 'data:image/' not in rebuilt, 'embedded image reintroduced'
          PY

      - name: Syntax and structural QA
        run: |
          set -euo pipefail
          node --check src/js/lab25q-config.js
          # runtime is the continuation of the same IIFE, so syntax-check exact concatenation.
          cat src/js/lab25q-config.js src/js/lab25q-runtime.js > /tmp/lab25q-rebuilt.js
          node --check /tmp/lab25q-rebuilt.js
          cmp -s /tmp/lab25q-rebuilt.js src/js/lab25q.js
          ! grep -R "data:image/" src/index.html src/css/lab25q.css src/js/lab25q-config.js src/js/lab25q-runtime.js
          grep -q 'js/lab25q-config.js' src/index.html
          grep -q 'js/lab25q-runtime.js' src/index.html

      - name: Record Phase 5 checkpoint
        run: |
          cat > docs/PHASE5_MODULARIZATION.md <<'EOF'
          # Phase 5 Modularization Checkpoint

          Phase 5 begins from user-verified Phase 4 commit `86353bf6cc66c85147db5a226354adbed6ea6e1f`.

          This increment is deliberately behavior-neutral. The proven monolithic runtime is split into ordered classic JavaScript files at a top-level declaration boundary. The workflow asserts that concatenating the modules reproduces `src/js/lab25q.js` byte-for-byte, so no gameplay statement, configuration value, renderer behavior, timing, collision logic, grounding, hazard calibration, or asset reference is changed by this increment.

          Known landscape, character-grounding, hazard sizing/positioning, and hitbox calibration issues remain deferred until landscape geometry is finalized.
          EOF

      - name: Commit Phase 5 increment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/js/lab25q-config.js src/js/lab25q-runtime.js docs/PHASE5_MODULARIZATION.md
          git commit -m "Phase 5 split LAB25Q runtime into ordered modules"
          git push origin HEAD:modular-parity-validation
