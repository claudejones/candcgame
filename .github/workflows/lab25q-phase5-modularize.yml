name: LAB25Q Phase 5 modularization

on:
  push:
    branches: ["modular-parity-validation"]
    paths: [".github/workflows/lab25q-phase5-modularize.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
          fetch-depth: 0

      - name: Extract configuration module from proven Phase 4 runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js = Path('src/js/lab25q.js')
          html = Path('src/index.html')
          text = js.read_text()
          token = 'const CONFIG='
          start = text.index(token)
          obj_start = start + len(token)
          if text[obj_start] != '{':
              raise SystemExit('CONFIG object start not found')

          depth = 0
          quote = None
          esc = False
          end = None
          for i in range(obj_start, len(text)):
              c = text[i]
              if quote:
                  if esc: esc = False
                  elif c == '\\': esc = True
                  elif c == quote: quote = None
                  continue
              if c in ('"', "'", '`'):
                  quote = c
              elif c == '{': depth += 1
              elif c == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None or text[end] != ';':
              raise SystemExit('CONFIG object end not found')
          end += 1

          original_decl = text[start:end]
          obj = text[obj_start:end-1]
          config_module = '"use strict";\nwindow.LAB25Q_CONFIG=' + obj + ';\n'
          runtime = text[:start] + 'const CONFIG=window.LAB25Q_CONFIG;' + text[end:]

          Path('src/js/lab25q-config.js').write_text(config_module)
          Path('src/js/lab25q-runtime.js').write_text(runtime)

          # Mechanical source-parity proof: substituting the one bridge binding back with
          # the extracted declaration must reconstruct the exact Phase 4 runtime.
          reconstructed = runtime.replace('const CONFIG=window.LAB25Q_CONFIG;', original_decl, 1)
          assert reconstructed == text, 'runtime differs beyond CONFIG bridge'
          assert ('window.LAB25Q_CONFIG=' + obj + ';') in config_module
          assert 'data:image/' not in config_module + runtime

          h = html.read_text()
          pat = re.compile(r'<script\s+src=["\'](?:\./)?js/lab25q\.js["\']([^>]*)></script>')
          m = pat.search(h)
          if not m:
              # Phase 1 preserved original script attributes, so accept any relative prefix.
              pat = re.compile(r'<script\s+src=["\'][^"\']*lab25q\.js["\']([^>]*)></script>')
              m = pat.search(h)
          if not m:
              raise SystemExit('lab25q script tag not found')
          attrs = m.group(1)
          replacement = '<script src="./js/lab25q-config.js"></script>\n<script src="./js/lab25q-runtime.js"' + attrs + '></script>'
          html.write_text(h[:m.start()] + replacement + h[m.end():])
          PY

      - name: Syntax and structural QA
        run: |
          set -euo pipefail
          node --check src/js/lab25q-config.js
          node --check src/js/lab25q-runtime.js
          ! grep -R "data:image/" src/index.html src/css/lab25q.css src/js/lab25q-config.js src/js/lab25q-runtime.js
          grep -q 'lab25q-config.js' src/index.html
          grep -q 'lab25q-runtime.js' src/index.html
          ! grep -q 'src=".*lab25q.js"' src/index.html

      - name: Record Phase 5 checkpoint
        run: |
          cat > docs/PHASE5_MODULARIZATION.md <<'EOF'
          # Phase 5 Modularization Checkpoint

          Phase 5 begins from user-verified Phase 4 commit `86353bf6cc66c85147db5a226354adbed6ea6e1f`.

          Increment 1 extracts the complete `CONFIG` object into `src/js/lab25q-config.js`. The runtime remains otherwise source-identical and receives that same object through one explicit `window.LAB25Q_CONFIG` bridge. Automated QA reconstructs the original Phase 4 runtime from the two outputs and fails if any runtime source changed beyond that bridge.

          No gameplay values, rendering behavior, timing, collision logic, grounding, hazard calibration, or asset references are changed. Known landscape, character-grounding, hazard sizing/positioning, and hitbox calibration issues remain deferred until landscape geometry is finalized.
          EOF

      - name: Commit Phase 5 increment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/js/lab25q-config.js src/js/lab25q-runtime.js docs/PHASE5_MODULARIZATION.md
          git commit -m "Phase 5 extract LAB25Q configuration module"
          git push origin HEAD:modular-parity-validation
