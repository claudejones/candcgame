name: Production CI
on:
  push:
    branches: [main, work/mobile-test-20260928]
  pull_request:
permissions:
  contents: read
jobs:
  current-workbench-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check.mjs
