name: LAB25Q Phase 4 HUD exact-byte assets

on:
  push:
    branches: ["modular-parity-validation"]
    paths:
      - '.github/workflows/lab25q-phase4-hud-a.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  externalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-parity-validation
      - name: Replace only exact-byte HUD heart and marker semantically
        shell: python
        run: |
          import re, pathlib, hashlib
          p=pathlib.Path('src/index.html')
          s=p.read_text()
          before=s
          rules=[
            (r"(--heart-sprite:url\(')data:image/png;base64,[A-Za-z0-9+/=]+('\))", r"\1../assets/hud/UI_LIFE_HEART.png\2", 'heart'),
            (r"(--character-sprite:url\(')data:image/png;base64,[A-Za-z0-9+/=]+('\))", r"\1../assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png\2", 'progress character')]
          for pat,repl,label in rules:
              s,n=re.subn(pat,repl,s,count=1)
              assert n==1, f'{label}: expected one semantic match, got {n}'
          p.write_text(s)
          assert s!=before
          assert '../assets/hud/UI_LIFE_HEART.png' in s
          assert '../assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png' in s
          # Phase 2 proved these two current named files are exact-byte matches to their LAB25Q payloads.
          remaining=len(re.findall(r'data:image/(?:png|jpeg);base64,', s)) + len(re.findall(r'data:image/(?:png|jpeg);base64,', pathlib.Path('src/js/lab25q.js').read_text()))
          assert remaining==60, remaining
          pathlib.Path('docs/LAB25Q_PHASE4_HUD_GATE.md').write_text('''# LAB25Q Phase 4 — HUD Gate A\n\nStatus: READY FOR VISUAL PARITY REVIEW\n\nChanged only two Phase-2 class-A, exact-byte HUD assets:\n\n- HUD heart -> `assets/hud/UI_LIFE_HEART.png`\n- HUD progress character marker -> `assets/hud/UI_STAGE_PROGRESS_CLAUDE_CONSTANCE.png`\n\nThe progress-path image remains embedded because Phase 2 classified its current approved named asset as geometry-changed (2048x258 historical -> 2172x724 current). It is intentionally NOT substituted in this gate.\n\nRemaining embedded image payloads: **60**.\n\nNo CSS, JavaScript, gameplay configuration, renderer metadata, or other asset references were changed.\n\nAcceptance: compare HUD against approved Phase 1. If equivalent, Gate A passes and progress-path geometry can be handled separately.\n''')
      - name: Commit HUD Gate A
        run: |
          git config user.name "claudejones"
          git config user.email "claudejones43@yahoo.com"
          git add src/index.html docs/LAB25Q_PHASE4_HUD_GATE.md
          git commit -m "Externalize exact-byte LAB25Q HUD sprites"
          git push origin HEAD:modular-parity-validation
